<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sojourner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2302040a'/%3E%3Cpath d='M16 4 L26 25 L21 28 L11 28 L6 25 Z' fill='%23c9ced4'/%3E%3Cpath d='M11 28 L21 28' stroke='%23f2a541' stroke-width='2'/%3E%3C/svg%3E" />
    <style>
      #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; background: #02040a; color: #9aa6b4; font: 0.8rem system-ui, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; transition: opacity 0.6s; }
      #boot .name { color: #dfe6ee; font-size: 1.6rem; font-weight: 300; letter-spacing: 0.5em; min-height: 2rem; }
      #boot .bar { width: 10rem; height: 2px; background: rgba(255, 255, 255, 0.1); overflow: hidden; position: relative; }
      #boot .bar::after { content: ''; position: absolute; top: 0; bottom: 0; width: 35%; background: #f2a541; animation: boot 1.1s ease-in-out infinite; }
      #boot .msg { max-width: 28rem; text-align: center; line-height: 1.6; letter-spacing: 0.08em; text-transform: none; font-size: 0.95rem; color: #dfe6ee; }
      #boot.done { opacity: 0; pointer-events: none; }
      @keyframes boot { from { left: -35%; } to { left: 100%; } }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="view"></canvas><div id="ui"></div></div>
    <div id="boot"><div class="name"></div><div class="bar"></div><div>Loading</div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
